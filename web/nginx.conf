server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header Content-Security-Policy "connect-src 'self'; worker-src 'self' blob:" always;
  location ~ \.mjs$ { default_type application/javascript; }
  location ~ \.wasm$ { default_type application/wasm; }
  location /api/ { proxy_pass http://api:8080; }
  location / { try_files $uri $uri/ /index.html; }
}
