name: verify
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label for isolated verification'
        required: false
        default: ubuntu-latest
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vhness
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: vhness_test
        options: --label vhness.ci-database=${{ github.run_id }}-${{ github.run_attempt }} --health-cmd "pg_isready -U vhness -d vhness_test" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.33.0 --force
      - name: Install bounded print extraction tools
        run: |
          if [ "$(id -u)" = 0 ]; then
            apt-get update && apt-get install --yes --no-install-recommends poppler-utils util-linux ffmpeg
          else
            sudo -n apt-get update && sudo -n apt-get install --yes --no-install-recommends poppler-utils util-linux ffmpeg
          fi
      - name: Verify with this run's disposable database
        env:
          TEST_DATABASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # The configured runner uses Docker bridge without service DNS.
          # Resolve exactly this run's labeled service, never a shared alias.
          [[ "$TEST_DATABASE_RUN" =~ ^[0-9]+-[0-9]+$ ]]
          test_db_id=$(docker ps --no-trunc --quiet --filter "label=vhness.ci-database=$TEST_DATABASE_RUN")
          if ! [[ "$test_db_id" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Expected exactly one database container for this run' >&2
            exit 1
          fi
          test_db_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$test_db_id")
          if ! [[ "$test_db_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo 'Expected exactly one IPv4 address for the job database' >&2
            exit 1
          fi
          export TEST_DATABASE_URL="postgres://vhness:disposable-ci-only@$test_db_ip:5432/vhness_test?sslmode=disable"
          make verify
  image:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish the reference frontend image for this revision
        env:
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
          IMAGE: git.subcult.tv/subculture-collective/archive-reference
        run: |
          set -euo pipefail
          test -n "$REGISTRY_PAT"
          auth_dir=$(mktemp -d)
          trap 'rm -rf "$auth_dir"' EXIT
          chmod 700 "$auth_dir"
          export DOCKER_BUILDKIT=1 DOCKER_CONFIG="$auth_dir/docker"
          docker build --target reference-frontend --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" .
          printf '%s' "$REGISTRY_PAT" | docker login git.subcult.tv --username subcult-agent --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          echo "published $(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")"

  seo:
    name: Build SEO frontend and deploy Almaz
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reuse an already accepted frontend artifact
        id: artifact
        if: github.server_url == 'https://git.subcult.tv' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          deploy_dir=$(mktemp -d)
          trap 'rm -rf "$deploy_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$deploy_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_dir/known_hosts"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          ssh_args=(-F /dev/null -i "$deploy_dir/key" -o ControlPath=none -o ControlMaster=no -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$deploy_dir/known_hosts"
            -o ConnectTimeout=15 onnwee@10.0.0.200)
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "artifact $DEPLOY_REVISION web" > "$deploy_dir/artifact.json"
          python3 - "$deploy_dir/artifact.json" "$GITHUB_OUTPUT" <<'PYCODE'
          import json, re, sys
          from pathlib import Path
          info = json.loads(Path(sys.argv[1]).read_text())
          available = info.get("available") is True
          if available:
              assert re.fullmatch(r"[0-9a-f]{64}", info.get("html_sha256", ""))
          with Path(sys.argv[2]).open("a") as output:
              output.write("available=" + str(available).lower() + "\n")
          PYCODE
      - name: Verify the owned curation gate
        run: docker build --target verify -f curation/Dockerfile curation
      - uses: actions/setup-node@v4
        if: steps.artifact.outputs.available != 'true'
        with:
          node-version: '24'
      - name: Install the locked frontend toolchain
        if: steps.artifact.outputs.available != 'true'
        run: npm install --global pnpm@10.33.0 --force
      - name: Build deployable images from the verified revision
        if: steps.artifact.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          image="fleet-deploy/arkhiv-seo/web:$DEPLOY_REVISION"
          pnpm install --frozen-lockfile
          pnpm --dir web build
          pnpm --dir web seo:render public/site.json https://arkhiv.subcult.tv/
          docker build --build-arg "SOURCE_REVISION=$DEPLOY_REVISION" -f web/Dockerfile.static \
            --label "org.opencontainers.image.revision=$DEPLOY_REVISION" \
            --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/arkhiv" -t "$image" web
          ARKHIV_SEO_IMAGE="$image" docker compose -f deploy/seo-compose.yml config --quiet
          bash scripts/check-seo-image.sh "$image"
      - name: Deploy the built image and verify public HTML
        if: >-
          github.server_url == 'https://git.subcult.tv' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          REUSE_ARTIFACT: ${{ steps.artifact.outputs.available }}
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          deploy_dir=$(mktemp -d)
          trap 'rm -rf "$deploy_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$deploy_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_dir/known_hosts"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          ssh_args=(-F /dev/null -i "$deploy_dir/key" -o ControlPath=none -o ControlMaster=no -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$deploy_dir/known_hosts"
            -o ConnectTimeout=15 onnwee@10.0.0.200)
          ssh "${ssh_args[@]}" status
          image="fleet-deploy/arkhiv-seo/web:$DEPLOY_REVISION"
          # The forced receiver accepts a full hexadecimal revision; expand it here.
          if [[ "$REUSE_ARTIFACT" != true ]]; then
            # shellcheck disable=SC2029
            docker save "$image" | ssh "${ssh_args[@]}" "receive $DEPLOY_REVISION web"
          fi
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "deploy $DEPLOY_REVISION"
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "artifact $DEPLOY_REVISION web" > "$deploy_dir/artifact.json"
          expected=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["html_sha256"])' "$deploy_dir/artifact.json")
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            --max-time 30 https://arkhiv.subcult.tv/ > "$deploy_dir/live.html"
          actual=$(sha256sum "$deploy_dir/live.html" | cut -d' ' -f1)
          test "$actual" = "$expected"
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            --max-time 30 https://arkhiv.subcult.tv/favicon.ico > "$deploy_dir/favicon"
          cmp web/public/favicon.ico "$deploy_dir/favicon"
          printf 'Live HTML matches the image built from %s\n' "$DEPLOY_REVISION"
