name: shared-platform-release
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label; use a repository-scoped temporary runner for isolated qualification'
        required: false
        default: ubuntu-latest
  push:
    tags:
      - 'archive-v*'
jobs:
  release:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vhness
          POSTGRES_PASSWORD: disposable-release-only
          POSTGRES_DB: vhness_release
        options: --label vhness.release-database=${{ github.run_id }}-${{ github.run_attempt }} --health-cmd "pg_isready -U vhness -d vhness_release" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.33.0 --force
      - name: Install bounded print extraction tools
        run: |
          if [ "$(id -u)" = 0 ]; then
            apt-get update && apt-get install --yes --no-install-recommends poppler-utils util-linux
          else
            sudo -n apt-get update && sudo -n apt-get install --yes --no-install-recommends poppler-utils util-linux
          fi
      - name: Require scoped package publishing credentials
        env:
          ARCHIVE_PACKAGE_TOKEN: ${{ secrets.ARCHIVE_PACKAGE_TOKEN }}
          ARCHIVE_REGISTRY_USER: ${{ vars.ARCHIVE_REGISTRY_USER }}
        run: |
          test -n "$ARCHIVE_PACKAGE_TOKEN" || { echo 'Configure ARCHIVE_PACKAGE_TOKEN with package read/write permission' >&2; exit 1; }
          test -n "$ARCHIVE_REGISTRY_USER" || { echo 'Configure ARCHIVE_REGISTRY_USER for the token owner' >&2; exit 1; }
      - name: Verify release with the job-owned disposable database
        env:
          TEST_DATABASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$TEST_DATABASE_RUN" =~ ^[0-9]+-[0-9]+$ ]]
          test_db_id=$(docker ps --no-trunc --quiet --filter "label=vhness.release-database=$TEST_DATABASE_RUN")
          [[ "$test_db_id" =~ ^[0-9a-f]{64}$ ]]
          test_db_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$test_db_id")
          [[ "$test_db_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          export TEST_DATABASE_URL="postgres://vhness:disposable-release-only@$test_db_ip:5432/vhness_release?sslmode=disable"
          make verify
          # Fail before a registry push if verification changed the release tree.
          release_status=$(git status --porcelain)
          test -z "$release_status" || { printf 'Verification changed release paths:\n%s\n' "$release_status" >&2; exit 1; }
      - name: Publish immutable package and engine artifacts
        env:
          ARCHIVE_PACKAGE_TOKEN: ${{ secrets.ARCHIVE_PACKAGE_TOKEN }}
          ARCHIVE_REGISTRY_USER: ${{ vars.ARCHIVE_REGISTRY_USER }}
        run: |
          set -euo pipefail
          release_version=$(node -p "require('./packages/viewer/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF" = "refs/tags/archive-v$release_version"
          fi
          release_auth_dir=$(mktemp -d)
          trap 'rm -rf "$release_auth_dir"' EXIT
          chmod 700 "$release_auth_dir"
          export NPM_CONFIG_USERCONFIG="$release_auth_dir/npmrc"
          cat > "$NPM_CONFIG_USERCONFIG" <<'NPMRC'
          @subcult:registry=https://git.subcult.tv/api/packages/subculture-collective/npm/
          //git.subcult.tv/api/packages/subculture-collective/npm/:_authToken=${ARCHIVE_PACKAGE_TOKEN}
          NPMRC
          chmod 600 "$NPM_CONFIG_USERCONFIG"
          export DOCKER_CONFIG="$release_auth_dir/docker"
          printf '%s' "$ARCHIVE_PACKAGE_TOKEN" | docker login git.subcult.tv --username "$ARCHIVE_REGISTRY_USER" --password-stdin
          release_image="git.subcult.tv/subculture-collective/archive-engine:$GITHUB_SHA"
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$release_version" -t "$release_image" .
          docker push "$release_image"
          engine_digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$release_image")
          python3 scripts/release_manifest.py --package ".artifacts/subcult-archive-viewer-$release_version.tgz" --engine-digest "$engine_digest" --output ".artifacts/release-$release_version.json"
          npm publish ".artifacts/subcult-archive-viewer-$release_version.tgz" --registry https://git.subcult.tv/api/packages/subculture-collective/npm/
      - uses: actions/upload-artifact@v3
        with:
          name: shared-platform-release
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
