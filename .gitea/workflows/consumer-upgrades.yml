name: consumer-upgrade-proposals
on:
  push:
    branches: [main]
    paths:
      - docs/releases/*.json
      - docs/reference/consumer-registry.json
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed release version with a committed receipt
        required: true
      kind:
        description: Independent viewer, independent core, or legacy platform release
        required: false
        default: viewer
      adoption_refs:
        description: Stack on the reviewed initial adoption branches
        required: false
        default: 'false'
      runner:
        description: Optional repository-scoped qualification runner
        required: false
        default: ubuntu-latest
permissions:
  contents: read

jobs:
  propose:
    timeout-minutes: 30
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: disposable-dev-only
          POSTGRES_DB: postgres
        options: --label arkhiv.upgrade-database=${{ github.run_id }}-${{ github.run_attempt }} --health-cmd "pg_isready -U dev -d postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the receipts to propose
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          INPUT_KIND: ${{ inputs.kind || 'viewer' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            version="$INPUT_VERSION"
            if [ -z "$version" ]; then
              if [ "$INPUT_KIND" = core ]; then
                version=$(python3 -c 'import json; print(json.load(open("docs/reference/core-version.json"))["version"])')
              else
                version=$(node -p "require('./packages/viewer/package.json').version")
              fi
            fi
            echo "releases=$INPUT_KIND=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          releases=""
          for file in $(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- docs/releases docs/reference/consumer-registry.json | sort -u); do
            case "$file" in
              docs/releases/viewer-release-*.json) releases="$releases viewer=${file#docs/releases/viewer-release-}" ;;
              docs/releases/core-release-*.json) releases="$releases core=${file#docs/releases/core-release-}" ;;
              docs/reference/consumer-registry.json)
                releases="$releases viewer=$(node -p "require('./packages/viewer/package.json').version") core=$(python3 -c 'import json; print(json.load(open("docs/reference/core-version.json"))["version"])')" ;;
            esac
          done
          releases=$(for entry in $releases; do echo "${entry%.json}"; done | sort -u | tr '\n' ' ')
          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          echo "Proposing: ${releases:-nothing}"
      - uses: actions/setup-go@v5
        if: steps.select.outputs.releases != ''
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-node@v4
        if: steps.select.outputs.releases != ''
        with:
          node-version: '24'
      - name: Install consumer verification tools
        if: steps.select.outputs.releases != ''
        run: |
          if [ "$(id -u)" = 0 ]; then
            apt-get update && apt-get install --yes --no-install-recommends poppler-utils util-linux ffmpeg postgresql-client-16
          else
            sudo -n apt-get update && sudo -n apt-get install --yes --no-install-recommends poppler-utils util-linux ffmpeg postgresql-client-16
          fi
      - name: Propose compatible consumer upgrades
        if: steps.select.outputs.releases != ''
        env:
          ARCHIVE_UPGRADE_DATABASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          ARCHIVE_RELEASES: ${{ steps.select.outputs.releases }}
          ARCHIVE_ADOPTION_REFS: ${{ inputs.adoption_refs || 'false' }}
          ARCHIVE_PACKAGE_READ_TOKEN: ${{ secrets.ARCHIVE_PACKAGE_READ_TOKEN }}
          ARCHIVE_UPGRADE_TOKEN: ${{ secrets.ARCHIVE_UPGRADE_TOKEN }}
        run: |
          set -euo pipefail
          export ARCHIVE_UPGRADE_DATABASE_CONTAINER=$(docker ps --no-trunc --quiet --filter "label=arkhiv.upgrade-database=$ARCHIVE_UPGRADE_DATABASE_RUN")
          test -n "$ARCHIVE_UPGRADE_DATABASE_CONTAINER"
          python3 scripts/bind_upgrade_database.py
          test -n "$ARCHIVE_UPGRADE_TOKEN"
          tool_dir=$(mktemp -d)
          auth_dir=$(mktemp -d)
          trap 'rm -rf "$tool_dir" "$auth_dir"' EXIT
          chmod 700 "$auth_dir"
          test -n "$ARCHIVE_PACKAGE_READ_TOKEN"
          printf '%s\n' '@subcult:registry=https://git.subcult.tv/api/packages/subculture-collective/npm/' '//git.subcult.tv/api/packages/subculture-collective/npm/:_authToken=${ARCHIVE_PACKAGE_READ_TOKEN}' > "$auth_dir/npmrc"
          chmod 600 "$auth_dir/npmrc"
          export NPM_CONFIG_USERCONFIG="$auth_dir/npmrc"
          npm install --prefix "$tool_dir" pnpm@10.33.0
          export PATH="$tool_dir/node_modules/.bin:$PATH"
          for entry in $ARCHIVE_RELEASES; do
            kind="${entry%%=*}"
            version="${entry#*=}"
            case "$kind" in viewer|core|platform) ;; *) echo "Unknown release kind $kind" >&2; exit 1 ;; esac
            echo "::group::Propose $kind $version"
            if [ "$ARCHIVE_ADOPTION_REFS" = true ]; then
              python3 scripts/propose_release_upgrades.py --kind "$kind" --version "$version" --adoption-refs --auto-merge
            else
              test "$ARCHIVE_ADOPTION_REFS" = false
              python3 scripts/propose_release_upgrades.py --kind "$kind" --version "$version" --auto-merge
            fi
            echo "::endgroup::"
          done
