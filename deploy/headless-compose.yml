services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: arkhiv
      POSTGRES_DB: arkhiv
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
    volumes:
      - ./runtime/database-password:/run/secrets/database-password:ro
      - ./runtime/database:/var/lib/postgresql/data
    networks: [archive]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, pg_isready -U arkhiv -d arkhiv]
      interval: 5s
      timeout: 5s
      retries: 10
  archive-core:
    image: ${ARCHIVE_ENGINE_IMAGE:?Select the reviewed immutable core pin}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    env_file: [./runtime/core.env]
    volumes:
      - ./runtime/database-url:/run/secrets/database-url:ro
      - ./runtime/media:/media:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=128m]
    mem_limit: 1g
    cpus: 2
    networks: [archive]
  reference:
    image: ${ARKHIV_REFERENCE_IMAGE:?Select the independently built frontend image}
    restart: unless-stopped
    depends_on:
      archive-core: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m]
    mem_limit: 256m
    cpus: 1
    networks:
      archive: {}
      projects:
        aliases: [arkhiv-platform-reference]
networks:
  archive:
    internal: true
    ipam:
      config:
        - subnet: ${ARKHIV_ARCHIVE_SUBNET:?Select an unused reviewed subnet for this instance}
  projects:
    external: true
